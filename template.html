<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Czytnik EPUB z translatorem Gemini</title>
    <!-- Wymagane biblioteki do obsługi formatu EPUB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0a0a;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            background: rgb(79, 79, 79);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        input, button {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #007bff;
            color: rgb(79, 79, 79);
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        #translate-btn {
            background-color: #28a745;
            font-weight: bold;
        }
        #translate-btn:hover {
            background-color: #218838;
        }
        #viewer {
            width: 100%;
            max-width: 800px;
            height: 70vh;
            background: rgb(79, 79, 79);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        #loading {
            display: none;
            color: #28a745;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <input type="file" id="book-input" accept=".epub">
        <input type="password" id="api-key" placeholder="Wklej swój klucz API Gemini" style="width: 200px;">
        
        <button id="prev-btn" disabled>Poprzednia</button>
        <button id="next-btn" disabled>Następna</button>
        
        <button id="translate-btn" disabled>🌐 Przetłumacz stronę</button>
        <span id="loading">Tłumaczenie w toku...</span>
    </div>

    <!-- Miejsce, w którym wyrenderuje się książka -->
    <div id="viewer"></div>

    <script>
        let book = null;
        let rendition = null;

        const bookInput = document.getElementById('book-input');
        const apiKeyInput = document.getElementById('api-key');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const translateBtn = document.getElementById('translate-btn');
        const loadingText = document.getElementById('loading');

        // Obsługa wgrania pliku EPUB
        bookInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Wyczyść poprzednią książkę jeśli istnieje
            if (book) { book.destroy(); }
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const bookData = event.target.result;
                
                // Inicjalizacja książki
                book = ePub(bookData);
                rendition = book.renderTo("viewer", {
                    width: "100%",
                    height: "100%",
                    spread: "none" // Zapobiega widokowi dwóch stron naraz dla ułatwienia tłumaczenia
                });
                
                rendition.display();

                // Odblokuj przyciski po załadowaniu
                prevBtn.disabled = false;
                nextBtn.disabled = false;
                translateBtn.disabled = false;
            };
            
            reader.readAsArrayBuffer(file);
        });

        // Nawigacja po książce
        nextBtn.addEventListener('click', () => rendition && rendition.next());
        prevBtn.addEventListener('click', () => rendition && rendition.prev());

        // Główna logika tłumaczenia
        translateBtn.addEventListener('click', async () => {
            if (!rendition) return alert('Najpierw załaduj książkę!');
            
            const apiKey = apiKeyInput.value.trim();
            // if (!apiKey) return alert('Proszę podać klucz API Gemini (Google AI Studio)!');

            translateBtn.style.display = 'none';
            loadingText.style.display = 'inline';

            try {
                // Wyciąganie dokumentu HTML z iframe używanego przez epub.js
                const contents = rendition.getContents()[0];
                const body = contents.document.body;
                const originalHTML = body.innerHTML;

                // Prompt wymuszający zwrot czystego HTML
                const promptText = `
Jesteś systemem tłumaczącym wbudowanym w czytnik e-booków.
Twoim zadaniem jest przetłumaczenie poniższego kodu HTML z oryginalnego języka na język polski.
ZASADY KRYTYCZNE:
1. ZACHOWAJ absolutnie wszystkie tagi HTML, klasy, ID i strukturę w nienaruszonym stanie.
2. Przetłumacz TYLKO tekst widoczny dla czytelnika.
3. Zwróć WYŁĄCZNIE czysty kod HTML jako wynik (żadnych wyjaśnień, żadnych znaczników markdown np. \`\`\`html).

Oto kod do przetłumaczenia:
${originalHTML}
                `;

                // Używamy poprawnej struktury dla REST API
                const apiKeyHard = "AQ.Ab8RN6JzdUV4wjYtOxWL_DBJ3-h6h1J4N776pIWtcHGUsgj4-A";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKeyHard}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        // W REST API instrukcje systemowe wkładamy bezpośrednio do 'contents' 
                        // lub używamy pola 'system_instruction' wewnątrz 'generationConfig' (zależnie od endpointu).
                        // Najbezpieczniejsza metoda dla modelu 3.1:
                        contents: [{
                            parts: [{ text:promptText }]
                        }],
                        generationConfig: {
                            temperature: 0.3
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }
                
                // Wyciąganie i czyszczenie odpowiedzi
                let translatedHTML = data.candidates[0].content.parts[0].text;
                translatedHTML = translatedHTML.replace(/```html/gi, '').replace(/```/g, '').trim();

                // Płynna podmiana zawartości na ekranie
                body.innerHTML = translatedHTML;

            } catch (err) {
                console.error(err);
                alert('Wystąpił błąd podczas tłumaczenia: ' + err.message);
            } finally {
                loadingText.style.display = 'none';
                translateBtn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
